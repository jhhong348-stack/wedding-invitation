<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="robots" content="noindex, nofollow">

  <title>결혼식 RSVP 관리자</title>

  <link rel="stylesheet" href="admin.css">
</head>

<body>
  <main class="admin-page">

    <!-- 로그인 화면 -->
    <section
      class="login-view"
      id="login-view"
    >
      <div class="login-card">
        <p class="admin-eyebrow">WEDDING RSVP</p>
        <h1>관리자 로그인</h1>

        <p class="login-description">
          등록된 관리자 계정으로 로그인해주세요.
        </p>

        <form id="login-form">
          <div class="admin-field">
            <label for="admin-email">
              이메일
            </label>

            <input
              type="email"
              id="admin-email"
              autocomplete="username"
              required
            >
          </div>

          <div class="admin-field">
            <label for="admin-password">
              비밀번호
            </label>

            <input
              type="password"
              id="admin-password"
              autocomplete="current-password"
              required
            >
          </div>

          <p
            class="admin-error"
            id="login-error"
            role="alert"
          ></p>

          <button
            type="submit"
            class="primary-button"
            id="login-button"
          >
            <span class="login-button-text">
              로그인
            </span>

            <span
              class="login-button-loading"
              hidden
            >
              로그인 중...
            </span>
          </button>
        </form>
      </div>
    </section>

    <!-- 관리자 대시보드 -->
    <section
      class="dashboard-view"
      id="dashboard-view"
      hidden
    >
      <header class="dashboard-header">
        <div>
          <p class="admin-eyebrow">WEDDING RSVP</p>
          <h1>참석 현황</h1>

          <p
            class="admin-account"
            id="admin-account"
          ></p>
        </div>

        <button
          type="button"
          class="logout-button"
          id="logout-button"
        >
          로그아웃
        </button>
      </header>

      <!-- 통계 -->
      <section
        class="statistics-grid"
        aria-label="RSVP 통계"
      >
        <article class="stat-card">
          <span>총 응답</span>
          <strong id="stat-total-responses">0</strong>
          <small>건</small>
        </article>

        <article class="stat-card featured">
          <span>참석 예정</span>
          <strong id="stat-total-guests">0</strong>
          <small>명</small>
        </article>

        <article class="stat-card">
          <span>참석 응답</span>
          <strong id="stat-attending">0</strong>
          <small>건</small>
        </article>

        <article class="stat-card">
          <span>불참</span>
          <strong id="stat-not-attending">0</strong>
          <small>건</small>
        </article>

        <article class="stat-card">
          <span>미정</span>
          <strong id="stat-undecided">0</strong>
          <small>건</small>
        </article>

        <article class="stat-card">
          <span>신랑측 인원</span>
          <strong id="stat-groom-guests">0</strong>
          <small>명</small>
        </article>

        <article class="stat-card">
          <span>신부측 인원</span>
          <strong id="stat-bride-guests">0</strong>
          <small>명</small>
        </article>

        <article class="stat-card">
          <span>양측 지인 인원</span>
          <strong id="stat-both-guests">0</strong>
          <small>명</small>
        </article>
      </section>

      <!-- 검색 및 필터 -->
      <section class="dashboard-controls">
        <div class="search-wrapper">
          <label for="admin-search">
            응답 검색
          </label>

          <input
            type="search"
            id="admin-search"
            placeholder="이름, 연락처, 동반인 검색"
          >
        </div>

        <div class="control-grid">
          <div>
            <label for="attendance-filter">
              참석 여부
            </label>

            <select id="attendance-filter">
              <option value="all">전체</option>
              <option value="attending">참석</option>
              <option value="not_attending">불참</option>
              <option value="undecided">미정</option>
            </select>
          </div>

          <div>
            <label for="side-filter">
              하객 구분
            </label>

            <select id="side-filter">
              <option value="all">전체</option>
              <option value="groom">신랑측</option>
              <option value="bride">신부측</option>
              <option value="both">양측 모두</option>
            </select>
          </div>

          <div>
            <label for="sort-filter">
              정렬
            </label>

            <select id="sort-filter">
              <option value="newest">최근 응답순</option>
              <option value="updated">최근 수정순</option>
              <option value="oldest">오래된순</option>
              <option value="name">이름순</option>
            </select>
          </div>
        </div>

        <div class="control-actions">
          <button
            type="button"
            class="secondary-button"
            id="refresh-button"
          >
            새로고침
          </button>

          <button
            type="button"
            class="primary-button compact"
            id="csv-button"
          >
            CSV 다운로드
          </button>
        </div>
      </section>

      <!-- 상태 문구 -->
      <div
        class="dashboard-status"
        id="dashboard-status"
        role="status"
      >
        응답을 불러오는 중입니다.
      </div>

      <!-- 응답 목록 -->
      <section
        class="response-list"
        id="response-list"
        aria-label="RSVP 응답 목록"
      ></section>
    </section>
  </main>

  <script
    type="module"
    src="admin.js"
  ></script>
</body>
</html>
